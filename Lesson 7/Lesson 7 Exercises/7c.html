<!DOCTYPE html>
<html>

    <title></title>
  </head>
  <body>
    <script>
      function greet(name) {
        if (!name) {
          console.log('Hi there!');
        } else {
          console.log(`Hello ${name}!`);
        }
      }
      greet('Pratham');
      greet();
    </script>
  </body>
